name: Node.js CI

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm install
      - run: npm run build
      - run: npm test

      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            builder/tests/
            dist/
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ "18", "20", "22", "24", "26" ]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v8
        with:
          name: build
          path: .

      - run: npm install --ignore-scripts
      - run: find builder/tests dist -type f -exec touch {} +
      - run: npm run test-bundled
